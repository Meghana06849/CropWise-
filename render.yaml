services:
  - type: web
    name: cropwise
    runtime: node
    rootDir: .
    plan: free
    buildCommand: npm run build:all
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 7d
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRY
        value: 30d
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: OPENWEATHER_BASE_URL
        value: https://api.openweathermap.org
      - key: ALLOWED_ORIGINS
        sync: false
